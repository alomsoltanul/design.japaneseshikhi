<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body,#root{height:100%}
body{font-family:'Inter',sans-serif;background:#0b0d14;color:#e5e7eb;overflow:hidden}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#252940;border-radius:3px}

@keyframes orb1{0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(40px,-30px) scale(1.08)}}
@keyframes orb2{0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-35px,45px) scale(0.94)}}
@keyframes orb3{0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(30px,40px) scale(1.12)}}
@keyframes petal{0%{transform:translateY(-60px) rotate(0deg);opacity:0} 10%{opacity:.7} 90%{opacity:.4} 100%{transform:translateY(2000px) translateX(40px) rotate(360deg);opacity:0}}
.petal{position:absolute;border-radius:150% 0 150% 0;pointer-events:none;animation:petal linear infinite;background:linear-gradient(135deg,rgba(255,182,197,.78),rgba(255,140,165,.60))}
@media(prefers-reduced-motion:reduce){.petal{animation:none}}

/* Layout */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:370px;flex-shrink:0;background:#111320;border-right:1px solid #1e2235;display:flex;flex-direction:column;overflow:hidden}
.sidebar-head{padding:16px 20px 12px;border-bottom:1px solid #1e2235;flex-shrink:0;display:flex;align-items:center;justify-content:space-between}
.sidebar-logo{height:18px}
.sidebar-badge{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#4b5563}
.tabs{display:flex;border-bottom:1px solid #1e2235;flex-shrink:0}
.tab{flex:1;padding:10px 0;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;border:none;background:transparent;color:#4b5563;cursor:pointer;transition:color .15s;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:#9ca3af}.tab.on{color:#E63946;border-bottom-color:#E63946}
.scroll{flex:1;overflow-y:auto;padding:14px 18px 20px}

/* Template picker */
.tpl-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:14px}
.tpl-btn{background:#1a1d2c;border:1px solid #252940;border-radius:10px;padding:9px 4px 7px;cursor:pointer;text-align:center;transition:all .15s}
.tpl-btn:hover{border-color:#374151}.tpl-btn.on{background:rgba(230,57,70,.1);border-color:rgba(230,57,70,.4)}
.tpl-jp{font-size:19px;line-height:1;margin-bottom:4px;color:#e5e7eb}
.tpl-en{font-size:9px;font-weight:700;letter-spacing:.04em;color:#6b7280;text-transform:uppercase}
.tpl-btn.on .tpl-en{color:#E63946}

/* Format selector */
.fmt-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:14px}
.fmt-btn{background:#1a1d2c;border:1px solid #252940;border-radius:9px;padding:9px 10px 8px;cursor:pointer;text-align:left;transition:all .15s;display:flex;flex-direction:column;gap:2px}
.fmt-btn:hover{border-color:#374151}.fmt-btn.on{background:rgba(230,57,70,.08);border-color:rgba(230,57,70,.4)}
.fmt-name{font-size:12px;font-weight:700;color:#e5e7eb;display:flex;align-items:center;gap:6px}
.fmt-btn.on .fmt-name{color:#E63946}
.fmt-dims{font-size:9px;font-weight:600;color:#4b5563;letter-spacing:.03em}
.fmt-icon{font-size:10px;opacity:.7}

/* Swatches */
.swatch-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.swatch{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;transition:transform .15s,border-color .15s;flex-shrink:0}
.swatch:hover{transform:scale(1.15)}.swatch.on{border-color:#fff;transform:scale(1.12);box-shadow:0 0 0 2px rgba(255,255,255,.15)}

/* Image upload */
.img-drop{border:2px dashed #252940;border-radius:12px;padding:16px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:8px}
.img-drop:hover,.img-drop.drag{border-color:#E63946;background:rgba(230,57,70,.05)}
.img-drop.has{border-style:solid;border-color:rgba(42,157,143,.5);background:rgba(42,157,143,.05)}
.img-drop-icon{font-size:22px;margin-bottom:5px}
.img-drop-txt{font-size:11px;font-weight:600;color:#6b7280;line-height:1.4}
.img-thumb{width:100%;height:72px;object-fit:cover;border-radius:7px;margin-top:8px;display:block}
.img-clear{background:none;border:1px solid #374151;border-radius:6px;padding:5px 12px;font-size:11px;font-weight:600;color:#9ca3af;cursor:pointer;margin-top:7px;width:100%;transition:all .15s}
.img-clear:hover{border-color:#E63946;color:#E63946}

/* Fields */
.sec-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#4b5563;margin:14px 0 7px}
.field{margin-bottom:9px}
.field label{display:block;font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#6b7280;margin-bottom:4px}
.field input,.field textarea,.field select{width:100%;background:#1a1d2c;border:1px solid #252940;border-radius:8px;padding:8px 10px;font-size:13px;color:#e5e7eb;font-family:'Inter',sans-serif;outline:none;transition:border-color .15s;resize:none}
.field input:focus,.field textarea:focus,.field select:focus{border-color:#E63946}
.field textarea{min-height:52px;line-height:1.5}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.word-slot{background:#1a1d2c;border:1px solid #252940;border-radius:10px;padding:10px;margin-bottom:7px}
.word-slot-head{font-size:10px;font-weight:700;color:#4b5563;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.word-slot .field{margin-bottom:5px}.word-slot .field:last-child{margin-bottom:0}

/* Sliders */
.slider-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.slider-row label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#6b7280;flex:0 0 72px}
.slider-row input[type=range]{flex:1;accent-color:#E63946;height:4px}
.slider-val{font-size:11px;font-weight:600;color:#9ca3af;flex:0 0 34px;text-align:right}

/* Toggles */
.toggle-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.toggle-label{font-size:12px;color:#9ca3af;font-weight:500}
.toggle-btn{width:38px;height:22px;background:#252940;border-radius:11px;cursor:pointer;position:relative;transition:background .2s;border:none;flex-shrink:0}
.toggle-btn.on{background:#E63946}
.toggle-btn::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;background:#fff;border-radius:50%;transition:left .2s;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.toggle-btn.on::after{left:19px}

/* Download */
.dl-wrap{padding:0 18px 18px;flex-shrink:0}
.dl-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(90deg,#E63946,#6B21A8);color:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:opacity .2s,transform .15s;letter-spacing:.04em}
.dl-btn:hover{opacity:.9}.dl-btn:active{transform:translateY(1px)}.dl-btn:disabled{opacity:.4;cursor:not-allowed}

/* Preview area */
.preview-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b0d14;overflow:hidden;gap:12px}
.preview-wrap{box-shadow:0 24px 80px rgba(0,0,0,.75);border-radius:3px;overflow:hidden;flex-shrink:0}
.preview-label{font-size:11px;color:#374151;font-weight:600;letter-spacing:.08em;text-transform:uppercase}

/* Poster base — dimensions set via inline style per format */
.poster{position:relative;overflow:hidden;font-family:'Inter',sans-serif;user-select:none}
</style>

/* ══ SHARED DECORATIVE ══════════════════════════════════════ */
function Petals({ count = 10 }) {
  return Array.from({ length: count }, (_, i) => (
    <div key={i} className="petal" style={{
      left:`${4 + i * (96/count)}%`, top:0,
      animationDelay:`${(i * 1.13).toFixed(1)}s`,
      animationDuration:`${9 + (i % 4) * 1.5}s`,
      width: i%3===0?13:9, height: i%3===0?18:13,
    }} />
  ));
}

function Orbs({ c1='#E63946', c2='#6B21A8', c3='#F4A261' }) {
  return (
    <div style={{position:'absolute',inset:0,overflow:'hidden',pointerEvents:'none'}}>
      {[
        [c1,'-8%','-5%',null,null,500,500,'orb1 18s ease-in-out infinite'],
        [c2,null,null,'-5%','-8%',460,460,'orb2 22s ease-in-out infinite'],
        [c3,'40%',null,null,'18%',340,340,'orb3 16s ease-in-out infinite'],
      ].map(([c,t,l,b,r,w,h,anim],i) => (
        <div key={i} style={{position:'absolute',borderRadius:'50%',top:t,left:l,bottom:b,right:r,width:w,height:h,
          background:`radial-gradient(circle,${c}22 0%,transparent 70%)`,animation:anim}} />
      ))}
    </div>
  );
}

function LogoPill({ dark=true }) {
  return (
    <div style={{display:'inline-flex',alignItems:'center',gap:8,
      background:dark?'rgba(255,255,255,0.10)':'rgba(29,53,87,0.08)',
      border:`1px solid ${dark?'rgba(255,255,255,0.14)':'rgba(29,53,87,0.14)'}`,
      borderRadius:999,padding:'8px 18px'}}>
      <img src="assets/logo-light.webp" style={{height:22,filter:dark?'brightness(0) invert(1)':'none'}} alt="" />
    </div>
  );
}

function DomainPill({ accent }) {
  return (
    <div style={{background:`linear-gradient(90deg,${accent.p},${accent.s})`,borderRadius:999,
      padding:'10px 26px',fontSize:16,fontWeight:700,color:'#fff',whiteSpace:'nowrap'}}>
      japaneseshikhi.com
    </div>
  );
}

function PosterShell({ accent, fx, bgOverride, gridLines, children, fmt={w:1080,h:1080} }) {
  const bg = bgOverride || accent.bg;
  const isLandscape = fmt.w > fmt.h;
  const padV = fmt.h >= 1800 ? 100 : isLandscape ? 60 : 72;
  const padH = isLandscape ? 96 : 80;
  return (
    <div className="poster" style={{width:fmt.w,height:fmt.h,background:bg}}>
      {fx.orbs  && <Orbs c1={accent.p} c2={accent.s} />}
      {fx.petals && <Petals count={fmt.h>=1800?14:10} />}
      {gridLines && <div style={{position:'absolute',inset:0,pointerEvents:'none',zIndex:1,
        backgroundImage:'linear-gradient(rgba(255,255,255,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.025) 1px,transparent 1px)',
        backgroundSize:'80px 80px'}} />}
      <div style={{position:'relative',zIndex:2,height:'100%',display:'flex',flexDirection:'column',padding:`${padV}px ${padH}px`}}>
        {children}
      </div>
    </div>
  );
}

function GrammarPoster({ data, accent, fx, fmt }) {

/* ══ CONTROL PANELS ══════════════════════════════════════════ */
function F({label,children}){return <div className="field"><label>{label}</label>{children}</div>;}
function SI({v,k,onChange}){return <input value={v[k]||''} onChange={e=>onChange({...v,[k]:e.target.value})}/>;}
function SL({label,data,field,min=12,max=200,onChange}){
  const val=data[field]||Math.round((min+max)/2);
  return(
    <div className="slider-row">
      <label>{label}</label>
      <input type="range" min={min} max={max} value={val} onChange={e=>onChange({...data,[field]:+e.target.value})}/>
      <span className="slider-val">{val}px</span>
    </div>
  );
}
function LvlSel({data,onChange}){
  return <F label="Level"><select value={data.level||'N5'} onChange={e=>onChange({...data,level:e.target.value})}>
    {['N5','N4','N3','N2','N1'].map(l=><option key={l} value={l}>{l}</option>)}
  </select></F>;
}

function GrammarCtrl({data,onChange}){return <>
  <LvlSel data={data} onChange={onChange}/>
  <F label="Grammar Pattern"><SI v={data} k="pattern" onChange={onChange}/></F>
  <F label="Parts (comma-separated)"><SI v={data} k="parts" onChange={onChange}/></F>
  <div className="field-row"><F label="Example 1 JP"><SI v={data} k="ex1jp" onChange={onChange}/></F><F label="Example 1 BN"><SI v={data} k="ex1bn" onChange={onChange}/></F></div>
  <div className="field-row"><F label="Example 2 JP"><SI v={data} k="ex2jp" onChange={onChange}/></F><F label="Example 2 BN"><SI v={data} k="ex2bn" onChange={onChange}/></F></div>
  <div className="sec-label">Font Sizes</div>
  <SL label="Pattern" data={data} field="ptSize" min={40} max={140} onChange={onChange}/>
  <SL label="Examples" data={data} field="exSize" min={16} max={60} onChange={onChange}/>
</>;}

function KanjiCtrl({data,onChange}){return <>
  <LvlSel data={data} onChange={onChange}/>
  <div className="field-row"><F label="Kanji"><SI v={data} k="kanji" onChange={onChange}/></F><F label="Strokes"><SI v={data} k="strokes" onChange={onChange}/></F></div>
  <div className="field-row"><F label="Kun (くん)"><SI v={data} k="kun" onChange={onChange}/></F><F label="On (おん)"><SI v={data} k="on" onChange={onChange}/></F></div>
  <div className="field-row"><F label="Meaning EN"><SI v={data} k="meaningEn" onChange={onChange}/></F><F label="Meaning BN"><SI v={data} k="meaningBn" onChange={onChange}/></F></div>
  <F label="Example JP"><SI v={data} k="exJp" onChange={onChange}/></F>

/* ══ IMAGE UPLOAD WIDGET ════════════════════════════════════ */
function ImageUpload({ bgImage, onChange }) {
  const [drag, setDrag] = useState(false);
  const inputRef = useRef();

  const loadFile = (file) => {
    if (!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = e => onChange(e.target.result);
    reader.readAsDataURL(file);
  };

  return (
    <div>
      <div className="sec-label">Background / Feature Image</div>
      <div
        className={`img-drop${drag?' drag':''}${bgImage?' has':''}`}
        onClick={() => inputRef.current.click()}
        onDragOver={e=>{e.preventDefault();setDrag(true);}}
        onDragLeave={()=>setDrag(false)}
        onDrop={e=>{e.preventDefault();setDrag(false);loadFile(e.dataTransfer.files[0]);}}
      >
        <input ref={inputRef} type="file" accept="image/*" style={{display:'none'}}
          onChange={e=>loadFile(e.target.files[0])}/>
        {bgImage
          ? <>
              <div className="img-drop-txt" style={{color:'#2A9D8F',fontWeight:700}}>✓ Image loaded</div>
              <img src={bgImage} className="img-thumb" alt="" />
            </>
          : <>
              <div className="img-drop-icon">🖼</div>
              <div className="img-drop-txt">Click or drag & drop an image<br/>Works on Photo BG &amp; Img Card</div>
            </>
        }
      </div>
      {bgImage && <button className="img-clear" onClick={e=>{e.stopPropagation();onChange(null);}}>✕ Remove image</button>}
    </div>
  );
}

/* ══ APP ═════════════════════════════════════════════════════ */
function App() {
  const [tpl, setTpl]       = useState('grammar');
  const [accent, setAccent] = useState(ACCENTS[0]);
  const [fmt, setFmt]       = useState(FORMATS[0]);
  const [datas, setDatas]   = useState(DEFAULTS);
  const [fx, setFx]         = useState({ petals:true, orbs:true });
  const [bgImage, setBgImg] = useState(null);
  const [tab, setTab]       = useState('style');
  const [dl, setDl]         = useState(false);
  const hiddenRef           = useRef();

  // Compute preview dimensions fitting the available space
  const [winSz, setWinSz] = useState({ w: window.innerWidth, h: window.innerHeight });
  useEffect(() => {
    const upd = () => setWinSz({ w: window.innerWidth, h: window.innerHeight });
    window.addEventListener('resize', upd);
    return () => window.removeEventListener('resize', upd);
  }, []);
  const availW = winSz.w - 400;
  const availH = winSz.h - 120;
  const scaleByW = availW / fmt.w;
  const scaleByH = availH / fmt.h;
  const previewScale = Math.min(scaleByW, scaleByH, 640 / Math.max(fmt.w, fmt.h));
  const prevW = Math.round(fmt.w * previewScale);
  const prevH = Math.round(fmt.h * previewScale);

  const data    = datas[tpl];
  const setData = useCallback(d => setDatas(prev => ({ ...prev, [tpl]: d })), [tpl]);

  const isImgTpl = ['imgbg','imgcard','newsflash','newspanel'].includes(tpl);

  async function download() {
    setDl(true);
    try {
      await document.fonts.ready;
      await htmlToImage.toPng(hiddenRef.current, { width:fmt.w, height:fmt.h, pixelRatio:1, cacheBust:true });
      await new Promise(r => setTimeout(r, 350));
      const url = await htmlToImage.toPng(hiddenRef.current, {
        width:fmt.w, height:fmt.h, pixelRatio:2, cacheBust:true,
        style:{ transform:'none', transformOrigin:'top left' },
      });
      const a = document.createElement('a');
      a.href = url;
      a.download = `japanese-shikhi-${tpl}-${fmt.id}-${Date.now()}.png`;
      a.click();
    } catch(e) { console.error(e); }
    setDl(false);
  }

  const ActivePoster = POSTER_MAP[tpl];
  const ActiveCtrl   = CTRL_MAP[tpl];
  const tplMeta      = TEMPLATES.find(t => t.id === tpl);

  const posterProps = { data, accent, fx, fmt, bgImage };

  return (
    <div className="app">

      {/* ── SIDEBAR ── */}
      <div className="sidebar">
        <div className="sidebar-head">
          <img className="sidebar-logo" src="assets/logo-light.webp" alt="Japanese Shikhi" />
          <span className="sidebar-badge">Poster Studio</span>
        </div>

        <div className="tabs">
          {['style','content'].map(t => (
            <button key={t} className={`tab${tab===t?' on':''}`} onClick={() => setTab(t)}>
              {t === 'style' ? 'Style & Format' : 'Content'}
            </button>
          ))}
        </div>

        <div className="scroll">
          {tab === 'style' && <>
            {/* Template picker */}
            <div className="sec-label">Template</div>
            <div className="tpl-grid">
              {TEMPLATES.map(t => (
                <button key={t.id} className={`tpl-btn${tpl===t.id?' on':''}`}
                  onClick={() => { setTpl(t.id); setTab('content'); }}>
                  <div className="tpl-jp">{t.jp}</div>
                  <div className="tpl-en">{t.en}</div>
                </button>
              ))}
            </div>

            {/* Format selector */}
            <div className="sec-label">Format / Size</div>
            <div className="fmt-grid">
              {FORMATS.map(f => (
                <button key={f.id} className={`fmt-btn${fmt.id===f.id?' on':''}`} onClick={() => setFmt(f)}>
                  <div className="fmt-name"><span className="fmt-icon">{f.icon}</span>{f.label}</div>
                  <div className="fmt-dims">{f.dims}</div>
                  <div className="fmt-dims" style={{color:'#374151'}}>{f.sub}</div>
                </button>
              ))}
            </div>

            {/* Accent color */}
            <div className="sec-label">Accent Color</div>
            <div className="swatch-row">
              {ACCENTS.map(a => (
                <div key={a.id} className={`swatch${accent.id===a.id?' on':''}`}
                  style={{ background: a.id==='light' ? 'linear-gradient(135deg,#F9FAFB,#E5E7EB)' : `linear-gradient(135deg,${a.p},${a.s})` }}
                  onClick={() => setAccent(a)} title={a.id} />
              ))}
            </div>
            <div style={{fontSize:11,color:'#4b5563',marginBottom:14,marginTop:-6,fontWeight:500,lineHeight:1.6}}>
              {ACCENTS.map(a => a.id.charAt(0).toUpperCase()+a.id.slice(1)).join(' · ')}
            </div>

            {/* Effects */}
            <div className="sec-label">Effects</div>
            <div className="toggle-row">
              <span className="toggle-label">🌸 Sakura Petals</span>
              <button className={`toggle-btn${fx.petals?' on':''}`} onClick={() => setFx(f=>({...f,petals:!f.petals}))}/>
            </div>
            <div className="toggle-row">
              <span className="toggle-label">✨ Color Orbs</span>
              <button className={`toggle-btn${fx.orbs?' on':''}`} onClick={() => setFx(f=>({...f,orbs:!f.orbs}))}/>
            </div>

            {/* Image upload */}
            <ImageUpload bgImage={bgImage} onChange={setBgImg}/>
          </>}

          {tab === 'content' && <>
            <div className="sec-label">{tplMeta?.jp} {tplMeta?.en} — Content</div>
            {isImgTpl && !bgImage && (
              <div style={{background:'rgba(244,162,97,0.1)',border:'1px solid rgba(244,162,97,0.3)',borderRadius:10,padding:'10px 14px',marginBottom:12,fontSize:12,color:'rgba(244,162,97,0.9)',fontWeight:500,lineHeight:1.5}}>
                💡 Upload an image in Style tab for best results
              </div>
            )}
            <ActiveCtrl data={data} onChange={setData}/>
          </>}
        </div>

        <div className="dl-wrap">
          <button className="dl-btn" onClick={download} disabled={dl}>
            {dl ? '⏳ Rendering…' : `⬇  Download  ${fmt.dims}`}
          </button>
        </div>
      </div>

      {/* ── PREVIEW ── */}
      <div className="preview-area">
        <div className="preview-wrap" style={{ width:prevW, height:prevH }}>
          <div style={{ width:fmt.w, height:fmt.h, transform:`scale(${previewScale})`, transformOrigin:'top left' }}>
            <ActivePoster {...posterProps}/>
          </div>
        </div>
        <div className="preview-label">{fmt.dims} px &nbsp;·&nbsp; 2× HQ &nbsp;·&nbsp; {fmt.sub}</div>
      </div>

      {/* ── HIDDEN FULL-SIZE RENDER (no transform — for correct download) ── */}
      <div style={{ position:'fixed', left:-(fmt.w+100), top:-(fmt.h+100), width:fmt.w, height:fmt.h, pointerEvents:'none', zIndex:-999, overflow:'hidden' }}>
        <div ref={hiddenRef} style={{ width:fmt.w, height:fmt.h }}>
          <ActivePoster {...posterProps}/>
        </div>
      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

if ('serviceWorker' in navigator) {
